replicaCount: 1

image:
  repository: linuxserver/sonarr
  tag: "4.0.20"

env:
  puid: "99"
  pgid: "100"
  tz: Europe/London

persistence:
  enabled: true
  size: 5Gi
  config:
    storageClass: ""
    nfs:
      server: ""
      path: ""
  downloads:
    nfs:
      server: ""
      path: ""
    readOnly: false
  tv:
    nfs:
      server: ""
      path: ""
    readOnly: false

homelab:
  ingressRoute:
    enabled: false
    host: ""
    entryPoints:
      - websecure
    servicePort: 8989
    middleware:
      enabled: true
      name: sonarr-theme
      namespace: traefik
    forwardAuth:
      enabled: false
  lanService:
    enabled: false
    type: LoadBalancer
    loadBalancerIP: ""
  metrics:
    enabled: false
    port: 9707
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: v2.3.0
    externalSecret:
      enabled: false
      name: sonarr-api-key
      remoteKey: ""
      property: api_key
      secretKey: api-key

