replicaCount: 1

image:
  repository: linuxserver/sonarr
  tag: "4.0.19"

env:
  puid: "99"
  pgid: "100"
  tz: Europe/London

persistence:
  enabled: true
  size: 5Gi
  config:
    storageClass: ""
    nfs:
      server: ""
      path: ""
  downloads:
    nfs:
      server: ""
      path: ""
    readOnly: false
  tv:
    nfs:
      server: ""
      path: ""
    readOnly: false

homelab:
  ingressRoute:
    enabled: false
    host: ""
    entryPoints:
      - websecure
    servicePort: 8989
    middleware:
      enabled: true
      name: sonarr-theme
      namespace: traefik
    forwardAuth:
      enabled: false
      middlewareName: authentik-forward-auth
      middlewareNamespace: authentik
      outpostServiceName: authentik
      outpostServiceNamespace: authentik
      outpostServicePort: 80
  lanService:
    enabled: false
    type: LoadBalancer
    loadBalancerIP: ""
    metallbAddressPool: default-pool
  metrics:
    enabled: false
    port: 9707
    image:
      repository: ghcr.io/onedr0p/exportarr
      tag: v2.3.0
    externalSecret:
      enabled: false
      name: sonarr-api-key
      refreshInterval: 15s
      clusterSecretStoreName: vault-homelab
      remoteKey: ""
      property: api_key
      secretKey: api-key
