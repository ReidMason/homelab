{{- if .Values.homelab.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sonarr-prometheus-servicemonitor
  labels:
    name: sonarr-prometheus-servicemonitor
    release: monitoring
spec:
  selector:
    matchLabels:
      app: sonarr
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
{{- end }}
