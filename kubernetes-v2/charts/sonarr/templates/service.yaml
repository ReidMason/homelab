apiVersion: v1
kind: Service
metadata:
  name: sonarr
  labels:
    app: sonarr
spec:
  selector:
    app: sonarr
  ports:
    - name: http
      protocol: TCP
      port: 8989
      targetPort: 8989
    {{- if .Values.homelab.metrics.enabled }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.homelab.metrics.port }}
      targetPort: {{ .Values.homelab.metrics.port }}
    {{- end }}
{{- if .Values.homelab.lanService.enabled }}
---
{{/* no `-` trim here: it would eat the newline after `---`, merging it into the next line */}}
{{ include "common.lanService" (dict
  "name" "sonarr"
  "metallbAddressPool" .Values.homelab.lanService.metallbAddressPool
  "type" .Values.homelab.lanService.type
  "loadBalancerIP" .Values.homelab.lanService.loadBalancerIP
  "ports" (list (dict "name" "http" "port" 8989 "targetPort" 8989))
) }}
{{- end }}
