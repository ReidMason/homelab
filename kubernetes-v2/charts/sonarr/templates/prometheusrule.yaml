{{- if .Values.homelab.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sonarr-alerts
  labels:
    name: sonarr-alerts
    release: monitoring
spec:
  groups:
    - name: sonarr
      rules:
        - alert: SonarrDownloadClientUnavailable
          expr: sonarr_system_health_issues{source=~".*DownloadClient.*"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Sonarr reports its download client is unavailable"
            description: '{{ "{{" }} $labels.message {{ "}}" }}'
{{- end }}
