{{- if .Values.homelab.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sonarr-alerts
  labels:
    name: sonarr-alerts
    release: monitoring
spec:
  groups:
    - name: sonarr
      rules:
        - alert: SonarrDownloadClientUnavailable
          expr: sonarr_system_health_issues{source=~".*DownloadClient.*"} > 0
          for: 10s
          labels:
            severity: warning
            app: sonarr
          annotations:
            summary: "Sonarr reports its download client is unavailable"
            description: '{{ "{{" }} $labels.message {{ "}}" }}'
        - alert: SonarrAllIndexersDown
          expr: sum(sonarr_indexer_status) == count(sonarr_indexer_status)
          for: 15m
          labels:
            severity: critical
            app: sonarr
          annotations:
            summary: "All Sonarr indexers are unavailable"
            description: "Every configured Sonarr indexer is currently failing/backed off."
{{- end }}
