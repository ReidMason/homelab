{{- if .Values.homelab.logging.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: logging-alerts
  labels:
    name: logging-alerts
    release: monitoring
spec:
  groups:
    - name: logging
      rules:
        - alert: LokiDown
          expr: up{job="{{ .Values.homelab.logging.lokiJob }}"} == 0
          for: 5m
          labels:
            severity: critical
            app: loki
          annotations:
            summary: "Loki is unreachable"
            description: "Prometheus has not been able to scrape Loki for 5 minutes. Logs, including fern's remote syslog, are not being durably stored."
        - alert: AlloyDown
          expr: up{job="{{ .Values.homelab.logging.alloyJob }}"} == 0
          for: 5m
          labels:
            severity: critical
            app: alloy
          annotations:
            summary: "Alloy is unreachable"
            description: "Prometheus has not been able to scrape Alloy for 5 minutes. fern's remote syslog has nowhere to land."
{{- end }}
