apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-unraid-drives
  labels:
    grafana_dashboard: "1"
data:
  unraid-drives.json: |
    {
      "uid": "unraid-drives",
      "title": "Unraid Drives",
      "tags": ["unraid", "storage"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Drives",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "smartctl_device_temperature{job=\"unraid-smart\", temperature_type=\"current\", disk!=\"\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto"
            },
            {
              "refId": "B",
              "expr": "node_filesystem_size_bytes{job=\"unraid\", disk!=\"\"} - node_filesystem_avail_bytes{job=\"unraid\", disk!=\"\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto"
            },
            {
              "refId": "C",
              "expr": "node_filesystem_size_bytes{job=\"unraid\", disk!=\"\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "disk",
                "mode": "outer"
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Value #B",
                  "operator": "/",
                  "right": "Value #C"
                },
                "alias": "Usage %",
                "replaceFields": false
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "disk": 0,
                  "Value #A": 1,
                  "Usage %": 2,
                  "Value #B": 3,
                  "Value #C": 4
                },
                "renameByName": {
                  "disk": "Drive",
                  "Value #A": "Temp (°C)",
                  "Value #B": "Used",
                  "Value #C": "Total"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Temp (°C)" },
                "properties": [
                  { "id": "unit", "value": "celsius" },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "orange", "value": 45 },
                        { "color": "red", "value": 50 }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Usage %" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "orange", "value": 0.8 },
                        { "color": "red", "value": 0.9 }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Used" },
                "properties": [{ "id": "unit", "value": "bytes" }]
              },
              {
                "matcher": { "id": "byName", "options": "Total" },
                "properties": [{ "id": "unit", "value": "bytes" }]
              }
            ]
          }
        }
      ]
    }
