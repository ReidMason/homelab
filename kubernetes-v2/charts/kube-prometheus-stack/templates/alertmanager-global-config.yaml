apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-global-config
spec:
  route:
    receiver: "null"
    groupBy:
      - alertname
      - namespace
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
      - receiver: discord-critical
        matchers:
          - name: severity
            value: critical
        continue: false
      - receiver: discord
        continue: false
  inhibitRules:
    - sourceMatch:
        - name: alertname
          value: UnraidHostDown
      targetMatch:
        - name: app
          value: unraid
        - name: severity
          value: warning
      equal:
        - app
  receivers:
    - name: "null"
    - name: discord-critical
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          title: '{{ "{{ .Status | toUpper }}" }}: {{ "{{ .CommonLabels.alertname }}" }}'
          message: |-
            {{ "{{ range .Alerts }}" }}
            **{{ "{{ .Labels.severity | toUpper }}" }}**{{ "{{ if .Labels.namespace }}" }} in `{{ "{{ .Labels.namespace }}" }}`{{ "{{ end }}" }}
            {{ "{{ .Annotations.summary }}" }}
            {{ "{{ if .Annotations.description }}" }}{{ "{{ .Annotations.description }}" }}{{ "{{ end }}" }}
            [View in Prometheus]({{ "{{ .GeneratorURL }}" }})

            {{ "{{ end }}" }}
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          title: '{{ "{{ .Status | toUpper }}" }}: {{ "{{ .CommonLabels.alertname }}" }}'
          message: |-
            {{ "{{ range .Alerts }}" }}
            **{{ "{{ .Labels.severity | toUpper }}" }}**{{ "{{ if .Labels.namespace }}" }} in `{{ "{{ .Labels.namespace }}" }}`{{ "{{ end }}" }}
            {{ "{{ .Annotations.summary }}" }}
            {{ "{{ if .Annotations.description }}" }}{{ "{{ .Annotations.description }}" }}{{ "{{ end }}" }}
            [View in Prometheus]({{ "{{ .GeneratorURL }}" }})

            {{ "{{ end }}" }}
