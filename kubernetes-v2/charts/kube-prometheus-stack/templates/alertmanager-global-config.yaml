apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-global-config
spec:
  route:
    receiver: "null"
    groupBy:
      - alertname
      - namespace
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: Watchdog
      - receiver: discord
        continue: false
  receivers:
    - name: "null"
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook_url
          sendResolved: true
          title: '{{ "{{ .Status | toUpper }}" }}: {{ "{{ .CommonLabels.alertname }}" }}'
          message: |-
            {{ "{{ range .Alerts }}" }}
            **{{ "{{ .Labels.severity | toUpper }}" }}** in `{{ "{{ .Labels.namespace }}" }}`
            {{ "{{ .Annotations.summary }}" }}
            {{ "{{ if .Annotations.description }}" }}{{ "{{ .Annotations.description }}" }}{{ "{{ end }}" }}
            [View in Prometheus]({{ "{{ .GeneratorURL }}" }})

            {{ "{{ end }}" }}
