apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-notifier
  labels:
    app: relay-notifier
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: relay-notifier
  template:
    metadata:
      labels:
        app: relay-notifier
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: relay-notifier
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: NATS_URL
              value: {{ .Values.env.natsUrl | quote }}
            - name: PORT
              value: {{ .Values.env.port | quote }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homelab.externalSecret.name }}
                  key: {{ .Values.homelab.externalSecret.secretKey }}
          ports:
            - containerPort: {{ .Values.env.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.env.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.env.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
