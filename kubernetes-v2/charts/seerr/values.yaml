replicaCount: 1

image:
  repository: ghcr.io/seerr-team/seerr
  tag: "v3.3.0"

service:
  port: 80
  targetPort: 5055

persistence:
  enabled: true
  size: 5Gi
  nfs:
    server: ""
    path: ""

homelab:
  ingressRoute:
    enabled: false
    host: ""
    entryPoints:
      - websecure
    servicePort: 80
    middleware:
      enabled: false
      name: ""
      namespace: ""
    forwardAuth:
      enabled: false
      middlewareName: authentik-forward-auth
      middlewareNamespace: authentik
      outpostServiceName: authentik
      outpostServiceNamespace: authentik
      outpostServicePort: 9000
