image:
  repository: portainer/portainer-ce
  tag: "2.44.0-alpine"

persistence:
  enabled: true
  size: 10Gi
  nfs:
    server: fern.internal
    path: /mnt/user/kubernetes/portainer

homelab:
  ingressRoute:
    enabled: false
    host: ""
    entryPoints:
      - websecure
    servicePort: 9443
    scheme: https
    forwardAuth:
      enabled: false
      middlewareName: authentik-forward-auth
      middlewareNamespace: authentik
      outpostServiceName: authentik
      outpostServiceNamespace: authentik
      outpostServicePort: 80
