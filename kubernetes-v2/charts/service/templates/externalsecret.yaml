{{- if and .Values.externalSecret.enabled .Values.externalSecret.remoteKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name | quote }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.clusterSecretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.name | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.secretEnv }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey | quote }}
        property: {{ .property | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
{{- end }}
