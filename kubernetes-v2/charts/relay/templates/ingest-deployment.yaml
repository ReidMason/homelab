apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-ingest
  labels:
    app: relay-ingest
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      app: relay-ingest
  template:
    metadata:
      labels:
        app: relay-ingest
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: relay-ingest
          image: {{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: {{ .Values.natsUrl | quote }}
            - name: PORT
              value: {{ .Values.ingest.port | quote }}
          ports:
            - containerPort: {{ .Values.ingest.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.ingest.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.ingest.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
