apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    app: qbittorrent
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      {{- if .Values.persistence.enabled }}
      securityContext:
        fsGroup: {{ .Values.env.pgid | int }}
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      tolerations:
        - key: node.kubernetes.io/unreachable
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: gluetun
          image: {{ .Values.image.gluetun.repository }}:{{ .Values.image.gluetun.tag }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: {{ .Values.vpn.serviceProvider | quote }}
            - name: VPN_TYPE
              value: {{ .Values.vpn.type | quote }}
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homelab.externalSecret.name }}
                  key: {{ .Values.homelab.externalSecret.userProperty }}
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homelab.externalSecret.name }}
                  key: {{ .Values.homelab.externalSecret.passwordProperty }}
            - name: SERVER_REGIONS
              value: {{ .Values.vpn.serverRegions | quote }}
            {{- if .Values.vpn.extraFlags }}
            - name: OPENVPN_FLAGS
              value: {{ .Values.vpn.extraFlags | quote }}
            {{- end }}
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: {{ .Values.vpn.outboundSubnets | quote }}
            - name: FIREWALL_INPUT_PORTS
              value: {{ .Values.vpn.inputPorts | quote }}
            - name: TZ
              value: {{ .Values.env.tz | quote }}
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
        - name: qbittorrent
          image: {{ .Values.image.qbittorrent.repository }}:{{ .Values.image.qbittorrent.tag }}
          env:
            - name: PUID
              value: {{ .Values.env.puid | quote }}
            - name: PGID
              value: {{ .Values.env.pgid | quote }}
            - name: TZ
              value: {{ .Values.env.tz | quote }}
            - name: WEBUI_PORT
              value: {{ .Values.ports.qbittorrent | quote }}
          ports:
            - containerPort: {{ .Values.ports.qbittorrent }}
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
              {{- if .Values.persistence.downloads.readOnly }}
              readOnly: true
              {{- end }}
        - name: prowlarr
          image: {{ .Values.image.prowlarr.repository }}:{{ .Values.image.prowlarr.tag }}
          env:
            - name: PUID
              value: {{ .Values.env.puid | quote }}
            - name: PGID
              value: {{ .Values.env.pgid | quote }}
            - name: TZ
              value: {{ .Values.env.tz | quote }}
          ports:
            - containerPort: {{ .Values.ports.prowlarr }}
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
        - name: flaresolverr
          image: {{ .Values.image.flaresolverr.repository }}:{{ .Values.image.flaresolverr.tag }}
          env:
            - name: TZ
              value: {{ .Values.env.tz | quote }}
          ports:
            - containerPort: {{ .Values.ports.flaresolverr }}
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: qbittorrent-config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: qbittorrent-config
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: prowlarr-config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: prowlarr-config
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: downloads
          nfs:
            server: {{ .Values.persistence.downloads.nfs.server | quote }}
            path: {{ .Values.persistence.downloads.nfs.path | quote }}
