apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  labels:
    app: authentik-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      tolerations:
        - key: node.kubernetes.io/unreachable
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: authentik-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: ["server"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
            - containerPort: 9443
              name: https
          env:
            {{- include "authentik.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            {{- include "authentik.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "authentik.volumes" . | nindent 8 }}
