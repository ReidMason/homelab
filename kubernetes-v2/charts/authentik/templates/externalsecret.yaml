{{- include "common.externalSecret" (dict
  "name" .Values.homelab.externalSecret.name
  "remoteKey" .Values.homelab.externalSecret.remoteKey
  "refreshInterval" .Values.homelab.externalSecret.refreshInterval
  "clusterSecretStoreName" .Values.homelab.externalSecret.clusterSecretStoreName
  "enabled" .Values.homelab.externalSecret.enabled
  "secretEnv" (list
    (dict "secretKey" "secret-key" "property" .Values.homelab.externalSecret.secretKeyProperty)
    (dict "secretKey" "db-password" "property" .Values.homelab.externalSecret.dbPasswordProperty)
    (dict "secretKey" "bootstrap-password" "property" .Values.homelab.externalSecret.bootstrapPasswordProperty)
    (dict "secretKey" "bootstrap-email" "property" .Values.homelab.externalSecret.bootstrapEmailProperty)
  )
) }}
