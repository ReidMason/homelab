{{- if .Values.homelab.customIngressRoutes.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`unifi.skippythesnake.com`)
      kind: Rule
      services:
        - name: unifi-service
          port: 443
          scheme: https
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ExternalName
  externalName: unifi.internal
{{- end }}
