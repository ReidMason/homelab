{{- include "common.externalSecret" (dict
  "name" .Values.homelab.externalSecret.name
  "remoteKey" .Values.homelab.externalSecret.remoteKey
  "refreshInterval" .Values.homelab.externalSecret.refreshInterval
  "clusterSecretStoreName" .Values.homelab.externalSecret.clusterSecretStoreName
