kube-prometheus-stack:
  grafana:
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 39
          datasource: Prometheus
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        editable: false

  prometheus:
    prometheusSpec:
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      additionalScrapeConfigs:
        - job_name: unraid
          static_configs:
            - targets:
                - fern.internal:9100
          metric_relabel_configs:
            # Maps Unraid's array/pool mountpoints to a stable "disk" label so the
            # Unraid Drives dashboard can join capacity (this job) with temperature
            # (unraid-smart job) per drive. Update if a mountpoint assignment changes.
            - source_labels: [mountpoint]
              regex: /mnt/disk1
              target_label: disk
              replacement: disk1
            - source_labels: [mountpoint]
              regex: /mnt/disk2
              target_label: disk
              replacement: disk2
            - source_labels: [mountpoint]
              regex: /mnt/disk3
              target_label: disk
              replacement: disk3
            - source_labels: [mountpoint]
              regex: /mnt/cache
              target_label: disk
              replacement: cache
        - job_name: unraid-smart
          static_configs:
            - targets:
                - fern.internal:9633
          metric_relabel_configs:
            # Maps smartctl_exporter's raw /dev/sdX device names (from the Unraid
            # Main tab) to the same "disk" label used above. /dev/sdX letters are not
            # guaranteed stable across reboots on Linux in general, but have held
            # stable on this host; re-check the Unraid Main tab and update here if a
            # drive is ever physically replaced or a row looks wrong.
            - source_labels: [device]
              regex: sdf
              target_label: disk
              replacement: disk1
            - source_labels: [device]
              regex: sdd
              target_label: disk
              replacement: disk2
            - source_labels: [device]
              regex: sdb
              target_label: disk
              replacement: disk3
            - source_labels: [device]
              regex: sde
              target_label: disk
              replacement: parity
            - source_labels: [device]
              regex: sdc
              target_label: disk
              replacement: parity2
            - source_labels: [device]
              regex: nvme0
              target_label: disk
              replacement: cache
        - job_name: loki
          static_configs:
            - targets:
                - loki.loki.svc.cluster.local:3100
        - job_name: alloy
          static_configs:
            - targets:
                - alloy.alloy.svc.cluster.local:12345

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

homelab:
  ingressRoute:
    enabled: true
    host: grafana.skippythesnake.com
  externalSecret:
    enabled: true
    remoteKey: secret/prod/grafana
  alertmanager:
    externalSecret:
      enabled: true
      remoteKey: secret/prod/relay-notifier
  unraid:
    enabled: true
    job: unraid
    smartJob: unraid-smart
  logging:
    enabled: true
    lokiJob: loki
    alloyJob: alloy
