kube-prometheus-stack:
  grafana:
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 39
          datasource: Prometheus

  prometheus:
    prometheusSpec:
      retention: 15d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      additionalScrapeConfigs:
        - job_name: unraid
          static_configs:
            - targets:
                - fern.internal:9100
        - job_name: unraid-smart
          static_configs:
            - targets:
                - fern.internal:9633

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

homelab:
  ingressRoute:
    enabled: true
    host: grafana.skippythesnake.com
  externalSecret:
    enabled: true
    remoteKey: secret/prod/grafana
  alertmanager:
    externalSecret:
      enabled: true
      remoteKey: secret/prod/relay-notifier
  unraid:
    enabled: true
    job: unraid
    smartJob: unraid-smart
